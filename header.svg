<svg width="820" height="205" viewBox="0 0 820 205" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e4e2e2" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70a5fd"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#70a5fd"/>
    </linearGradient>
  </defs>

  <style>
    .terminal-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Fira Code", monospace;
      font-weight: 600;
      font-size: 12px;
      fill: #8b949e;
    }
    .prompt {
      font-family: "Fira Code", "Courier New", monospace;
      font-weight: 700;
      font-size: 14px;
      fill: url(#promptGrad);
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-weight: 800;
      font-size: 20px;
      fill: url(#textGradient);
      letter-spacing: 0.5px;
    }
    .sub-primary {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      fill: #f0f6fc;
    }
    .sub-secondary {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #8b949e;
    }
    .tag-badge {
      font-family: "Fira Code", monospace;
      font-weight: 600;
      font-size: 11px;
    }
    .quote-line {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      fill: #8b949e;
      font-style: italic;
    }

    /* Terminal Blinking Cursor */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #70a5fd;
    }

    /* Subtle Ambient Pulse */
    @keyframes ambientPulse {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }
    .ambient-box {
      animation: ambientPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Window Card -->
  <rect x="0.5" y="0.5" width="819" height="204" rx="8" fill="#151515" stroke="url(#headerBorder)" stroke-width="1.2" class="ambient-box"/>

  <!-- Window Header Bar -->
  <path d="M 0.5 8.5 C 0.5 4.08 4.08 0.5 8.5 0.5 L 811.5 0.5 C 815.92 0.5 819.5 4.08 819.5 8.5 L 819.5 32.5 L 0.5 32.5 Z" fill="#1c1f24" stroke="url(#headerBorder)" stroke-width="1.2"/>
  <line x1="0.5" y1="32.5" x2="819.5" y2="32.5" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Dots -->
  <circle cx="20" cy="16.5" r="5.5" fill="#ff5f56"/>
  <circle cx="36" cy="16.5" r="5.5" fill="#ffbd2e"/>
  <circle cx="52" cy="16.5" r="5.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="410" y="21" text-anchor="middle" class="terminal-title">hero@harshit:~ (zsh) — 80×24</text>

  <!-- Status Indicator at Right -->
  <circle cx="780" cy="16.5" r="3.5" fill="#34d399"/>
  <text x="770" y="20.5" text-anchor="end" class="tag-badge" fill="#38bdf8">ONLINE</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 0)">
    <!-- Command Prompt & Name -->
    <text x="0" y="60" class="prompt">hero@harshit:~$</text>
    <text x="135" y="60" class="name-title">Hero Harshit</text>
    <rect x="268" y="45" width="10" height="18" rx="2" class="cursor"/>

    <!-- Line 1: Primary Titles -->
    <text x="0" y="88" class="sub-primary">Full-Stack &amp; AI Explorer • Author &amp; Poet</text>

    <!-- Line 2: Institute -->
    <text x="0" y="108" class="sub-secondary">International Institute of Information Technology, Pune</text>

    <!-- 4 Clean Focus Tags (No Emojis) -->
    <g transform="translate(0, 126)">
      <!-- Pill 1: Agentic AI -->
      <rect width="100" height="24" rx="4" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="50" y="16" text-anchor="middle" class="tag-badge" fill="#c084fc">Agentic AI</text>

      <!-- Pill 2: Large Language Models -->
      <rect x="108" width="180" height="24" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="198" y="16" text-anchor="middle" class="tag-badge" fill="#38bdf8">Large Language Models</text>

      <!-- Pill 3: UI / UX -->
      <rect x="296" width="76" height="24" rx="4" fill="#1e293b" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="334" y="16" text-anchor="middle" class="tag-badge" fill="#34d399">UI / UX</text>

      <!-- Pill 4: Full-Stack -->
      <rect x="380" width="100" height="24" rx="4" fill="#1e293b" stroke="#fb8c00" stroke-opacity="0.6"/>
      <text x="430" y="16" text-anchor="middle" class="tag-badge" fill="#ffb74d">Full-Stack</text>
    </g>

    <!-- Poetic Baseline Quote -->
    <text x="0" y="180" class="quote-line">“Building creative digital experiences that people remember.”</text>
  </g>
</svg>
