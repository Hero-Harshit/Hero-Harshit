<svg width="260" height="230" viewBox="0 0 260 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .proj-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 16px; }
    .proj-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 600; font-size: 10px; fill: #bae6fd; }
    .stat-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 500; font-size: 11px; fill: #7dd3fc; }
  
    @media (prefers-color-scheme: light) {
        rect[fill="#151515"] { fill: #ffffff !important; stroke: #e1e4e8 !important; }
        .name-title { fill: #24292f !important; }
        .sub-primary, .quote-body { fill: #24292f !important; }
        .sub-secondary, .quote-line, .author-tag { fill: #57606a !important; }
        .terminal-title { fill: #57606a !important; }
        text[fill="#f0f6fc"] { fill: #24292f !important; }
        text[fill="#8b949e"] { fill: #57606a !important; }
    }

</style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="259" height="229" rx="8" fill="#151515" stroke="#e4e2e2" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Top Header with Icon & Title -->
  <g transform="translate(16, 20)">
    <!-- Icon Container -->
    <rect width="32" height="32" rx="6" fill="#0c2d48" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <image href="data:image/png;base64," x="0" y="0" width="32" height="32" preserveAspectRatio="xMidYMid slice"/>
    
    <!-- Title -->
    <text x="42" y="16" class="proj-title" fill="#38bdf8">Nxt-Health</text>
    <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="10.5px" fill="#60a5fa">Healthcare AI Platform</text>
  </g>

  <!-- Description -->
  <text x="16" y="80" class="proj-desc">
    <tspan x="16" dy="0">Explainable healthcare decision</tspan>
    <tspan x="16" dy="16">platform with OCR scanning, bill</tspan>
    <tspan x="16" dy="16">auditing, and emergency SOS.</tspan>
  </text>

  <!-- Stars & Language Row -->
  <g transform="translate(16, 148)">
    <text x="0" y="12" class="stat-text">⭐ 1 Star</text>
    <circle cx="70" cy="8" r="4" fill="#38bdf8"/>
    <text x="80" y="12" class="stat-text">TypeScript</text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(16, 182)">
    <rect width="48" height="22" rx="4" fill="#0f2942" stroke="#0284c7"/>
    <text x="24" y="15" text-anchor="middle" class="tag-text">LLMs</text>

    <rect x="54" width="72" height="22" rx="4" fill="#0f2942" stroke="#0284c7"/>
    <text x="90" y="15" text-anchor="middle" class="tag-text">Agentic AI</text>

    <rect x="132" width="56" height="22" rx="4" fill="#0f2942" stroke="#0284c7"/>
    <text x="160" y="15" text-anchor="middle" class="tag-text">FastAPI</text>
  </g>
</svg>
