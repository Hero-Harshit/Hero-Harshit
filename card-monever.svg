<svg width="260" height="230" viewBox="0 0 260 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .proj-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 16px; }
    .proj-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 600; font-size: 10px; fill: #cbd5e1; }
    .stat-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 500; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="259" height="229" rx="8" fill="#151515" stroke="#e4e2e2" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Top Header with Icon & Title -->
  <g transform="translate(16, 20)">
    <!-- Icon Container -->
    <rect width="32" height="32" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-opacity="0.6"/>
    <text x="16" y="21" text-anchor="middle" font-size="16">📼</text>
    
    <!-- Title -->
    <text x="42" y="16" class="proj-title" fill="#e2e8f0">Monever</text>
    <text x="42" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif" font-weight="600" font-size="10.5px" fill="#94a3b8">90s Financial App</text>
  </g>

  <!-- Description -->
  <text x="16" y="80" class="proj-desc">
    <tspan x="16" dy="0">A retro-aesthetic financial tool</tspan>
    <tspan x="16" dy="16">born from a hackathon, blending</tspan>
    <tspan x="16" dy="16">90s nostalgia with budgeting.</tspan>
  </text>

  <!-- Stars & Language Row -->
  <g transform="translate(16, 148)">
    <text x="0" y="12" class="stat-text">⭐ 1 Star</text>
    <circle cx="70" cy="8" r="4" fill="#94a3b8"/>
    <text x="80" y="12" class="stat-text">HTML / JS</text>
  </g>

  <!-- Tech Tags -->
  <g transform="translate(16, 182)">
    <rect width="48" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="15" text-anchor="middle" class="tag-text">React</text>

    <rect x="54" width="66" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="87" y="15" text-anchor="middle" class="tag-text">Chart.js</text>

    <rect x="126" width="68" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="15" text-anchor="middle" class="tag-text">JavaScript</text>
  </g>
</svg>
