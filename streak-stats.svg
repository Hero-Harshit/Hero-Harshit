<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 495 195' width='495px' height='195px'>
    <style>
        .bold-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 700; fill: #f0f6fc; }
        .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 500; font-size: 13px; fill: #8b949e; }
        .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 400; font-size: 11px; fill: #6e7681; }
        .accent-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 700; fill: #70a5fd; font-size: 22px; }
        .streak-highlight { fill: #FB8C00; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 700; font-size: 13px; }
        .date-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif; font-weight: 500; font-size: 10.5px; fill: #70a5fd; }
        
        /* Subtle Pulsing Flame Animation */
        @keyframes flameGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FB8C00); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 6px #FFA726); }
        }
        .flame-anim {
            transform-origin: 0px 22px;
            animation: flameGlow 2s ease-in-out infinite;
        }

        /* Subtle Ring Pulse */
        @keyframes ringGlow {
            0%, 100% { stroke-opacity: 0.85; stroke: #FB8C00; }
            50% { stroke-opacity: 1; stroke: #FFA726; }
        }
        .ring-anim {
            animation: ringGlow 2s ease-in-out infinite;
        }
    </style>

    <!-- Background Card -->
    <rect x='0.5' y='0.5' width='494' height='194' rx='4.5' fill='#151515' stroke='#e4e2e2' stroke-width='1'/>

    <!-- Column Dividers -->
    <line x1='165' y1='22' x2='165' y2='172' stroke='#e4e2e2' stroke-width='1'/>
    <line x1='330' y1='22' x2='330' y2='172' stroke='#e4e2e2' stroke-width='1'/>

    <!-- LEFT COLUMN: Total Contributions -->
    <g transform='translate(82.5, 0)'>
        <text x='0' y='72' text-anchor='middle' class='bold-num' font-size='28px'>1,616</text>
        <text x='0' y='104' text-anchor='middle' class='label-text'>Total Contributions</text>
        <text x='0' y='126' text-anchor='middle' class='sub-text'>Aug 10, 2025 - Present</text>
    </g>

    <!-- CENTER COLUMN: Current Streak -->
    <g transform='translate(247.5, 0)'>
        <!-- Smooth Glowing Ring with Pulse -->
        <circle cx='0' cy='64' r='36' fill='rgba(251, 140, 0, 0.05)' class='ring-anim' stroke='#FB8C00' stroke-width='3'/>
        
        <!-- Dual-Tone Animated Flame Icon at Top of Ring -->
        <g class='flame-anim'>
            <!-- Flame Outer Shell -->
            <path d="M 0 10 C 2.5 15 8 19 8 25 C 8 29.5 4.5 33 0 33 C -4.5 33 -8 29.5 -8 25 C -8 19 -2.5 15 0 10 Z" fill="#FB8C00" />
            <!-- Flame Core Glow -->
            <path d="M 0 18 C 1.5 21 4 23.5 4 27 C 4 29.5 2.2 31.5 0 31.5 C -2.2 31.5 -4 29.5 -4 27 C -4 23.5 -1.5 21 0 18 Z" fill="#FFE082" />
        </g>

        <!-- Streak Big Number -->
        <text x='0' y='73' text-anchor='middle' class='bold-num' font-size='26px'>377</text>
        
        <!-- Current Streak Label & Range -->
        <text x='0' y='122' text-anchor='middle' class='streak-highlight'>Current Streak</text>
        <text x='0' y='142' text-anchor='middle' class='sub-text'>Aug 10, 2025 - Present</text>
    </g>

    <!-- RIGHT COLUMN: Mean Commits & Max Commits -->
    <g transform='translate(412.5, 0)'>
        <!-- Top Metric: Mean Commits -->
        <g transform='translate(0, 42)'>
            <text x='0' y='0' text-anchor='middle' class='bold-num' font-size='22px'>4.3</text>
            <text x='0' y='18' text-anchor='middle' class='label-text'>Mean Commits</text>
            <text x='0' y='33' text-anchor='middle' class='sub-text'>Daily Average</text>
        </g>

        <!-- Horizontal Divider -->
        <line x1='-55' y1='88' x2='55' y2='88' stroke='#e4e2e2' stroke-width='1' stroke-opacity='0.4'/>

        <!-- Bottom Metric: Max Commits -->
        <g transform='translate(0, 118)'>
            <text x='0' y='0' text-anchor='middle' class='accent-num'>80</text>
            <text x='0' y='18' text-anchor='middle' class='label-text'>Max Commits</text>
            <text x='0' y='33' text-anchor='middle' class='date-sub'>August 1, 2026</text>
        </g>
    </g>
</svg>
