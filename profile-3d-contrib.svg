<svg width="820" height="320" viewBox="0 0 820 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#151515" />
    </linearGradient>

    <!-- Isometric Tower Gradients -->
    <!-- Highest Level (Bright Neon Green) -->
    <linearGradient id="tower-top-high" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56ff89" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>
    <linearGradient id="tower-left-high" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>
    <linearGradient id="tower-right-high" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#0e4429" />
    </linearGradient>

    <!-- Medium Level -->
    <linearGradient id="tower-top-med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39d353" />
      <stop offset="100%" stop-color="#26a641" />
    </linearGradient>
    <linearGradient id="tower-left-med" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#134f23" />
