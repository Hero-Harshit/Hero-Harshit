    <linearGradient id="tower-right-med" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#196c2e" />
      <stop offset="100%" stop-color="#082b13" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .h-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 700; font-size: 16px; fill: #70a5fd; }
      .h-sub { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 500; font-size: 12px; fill: #8b949e; }
      .stat-highlight { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 700; font-size: 13px; fill: #39d353; }
      .axis-label { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 600; font-size: 10px; fill: #6e7681; }
    </style>
  </defs>

  <!-- Card Background -->
