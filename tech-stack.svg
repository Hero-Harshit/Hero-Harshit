      <g transform="translate(288, 0)">
        <rect width="74" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#07405e" />
        <text x="24" y="17" class="pill-text">SQLite</text>
      </g>
      <!-- AWS -->
      <g transform="translate(372, 0)">
        <rect width="64" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#FF9900" />
        <text x="24" y="17" class="pill-text">AWS</text>
      </g>
      <!-- Vercel -->
      <g transform="translate(446, 0)">
        <rect width="76" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#ffffff" />
        <text x="24" y="17" class="pill-text">Vercel</text>
      </g>
      <!-- Render -->
      <g transform="translate(532, 0)">
        <rect width="80" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#46E3B7" />
        <text x="24" y="17" class="pill-text">Render</text>
