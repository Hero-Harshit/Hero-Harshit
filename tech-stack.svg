    <g transform="translate(170, 0)">
      <!-- MongoDB -->
      <g transform="translate(0, 0)">
        <rect width="90" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#4ea94b" />
        <text x="24" y="17" class="pill-text">MongoDB</text>
      </g>
      <!-- MySQL -->
      <g transform="translate(100, 0)">
        <rect width="76" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#4479A1" />
        <text x="24" y="17" class="pill-text">MySQL</text>
      </g>
      <!-- Supabase -->
      <g transform="translate(186, 0)">
        <rect width="92" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#3ECF8E" />
        <text x="24" y="17" class="pill-text">Supabase</text>
      </g>
