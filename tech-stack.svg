    <g transform="translate(170, 0)">
      <!-- React -->
      <g transform="translate(0, 0)">
        <rect width="72" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#61DAFB" />
        <text x="24" y="17" class="pill-text">React</text>
      </g>
      <!-- Next.js -->
      <g transform="translate(82, 0)">
        <rect width="80" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#ffffff" />
        <text x="24" y="17" class="pill-text">Next.js</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(172, 0)">
        <rect width="82" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#6DA55F" />
        <text x="24" y="17" class="pill-text">Node.js</text>
      </g>
      <!-- Express -->
      <g transform="translate(264, 0)">
        <rect width="82" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#61DAFB" />
        <text x="24" y="17" class="pill-text">Express</text>
      </g>
