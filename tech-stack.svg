<svg width="820" height="260" viewBox="0 0 820 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cat-title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 700; font-size: 13px; fill: #70a5fd; }
      .pill-text { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 600; font-size: 12px; fill: #f0f6fc; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" rx="8" width="819" height="259" fill="#151515" stroke="#30363d" stroke-width="1.2" />

  <!-- Section 1: Languages -->
  <g transform="translate(25, 20)">
    <text x="0" y="16" class="cat-title">💻 Languages</text>
    <g transform="translate(140, 0)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="80" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#3572A5" />
        <text x="24" y="17" class="pill-text">Python</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(90, 0)">
        <rect width="102" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#3178c6" />
        <text x="24" y="17" class="pill-text">TypeScript</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(202, 0)">
        <rect width="98" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#F7DF1E" />
        <text x="24" y="17" class="pill-text">JavaScript</text>
      </g>
      <!-- HTML5 / CSS3 -->
      <g transform="translate(310, 0)">
        <rect width="112" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#e34c26" />
        <text x="24" y="17" class="pill-text">HTML5 / CSS3</text>
      </g>
      <!-- SQL -->
      <g transform="translate(432, 0)">
        <rect width="60" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#e38c00" />
        <text x="24" y="17" class="pill-text">SQL</text>
      </g>
      <!-- PowerShell -->
      <g transform="translate(502, 0)">
        <rect width="102" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#5391FE" />
        <text x="24" y="17" class="pill-text">PowerShell</text>
      </g>
    </g>
  </g>

