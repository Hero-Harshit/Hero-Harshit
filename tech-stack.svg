    <g transform="translate(170, 0)">
      <!-- PyTorch -->
      <g transform="translate(0, 0)">
        <rect width="82" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#EE4C2C" />
        <text x="24" y="17" class="pill-text">PyTorch</text>
      </g>
      <!-- TensorFlow -->
      <g transform="translate(92, 0)">
        <rect width="102" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#FF6F00" />
        <text x="24" y="17" class="pill-text">TensorFlow</text>
      </g>
      <!-- Scikit-Learn -->
      <g transform="translate(204, 0)">
        <rect width="104" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#F7931E" />
        <text x="24" y="17" class="pill-text">Scikit-Learn</text>
      </g>
      <!-- Pandas -->
      <g transform="translate(318, 0)">
        <rect width="80" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#150458" />
        <text x="24" y="17" class="pill-text">Pandas</text>
      </g>
      <!-- NumPy -->
      <g transform="translate(408, 0)">
        <rect width="78" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#013243" />
        <text x="24" y="17" class="pill-text">NumPy</text>
      </g>
      <!-- Matplotlib -->
      <g transform="translate(496, 0)">
        <rect width="94" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#11557c" />
        <text x="24" y="17" class="pill-text">Matplotlib</text>
      </g>
