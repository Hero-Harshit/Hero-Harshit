        <circle cx="12" cy="13" r="4" fill="#38B2AC" />
        <text x="24" y="17" class="pill-text">TailwindCSS</text>
      </g>
      <!-- Bootstrap -->
      <g transform="translate(466, 0)">
        <rect width="90" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#8511FA" />
        <text x="24" y="17" class="pill-text">Bootstrap</text>
      </g>
      <!-- Vite -->
      <g transform="translate(566, 0)">
        <rect width="60" height="26" rx="6" fill="#21262d" stroke="#30363d" />
        <circle cx="12" cy="13" r="4" fill="#646CFF" />
        <text x="24" y="17" class="pill-text">Vite</text>
      </g>
